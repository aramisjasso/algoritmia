<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Aplica el tema antes de pintar para evitar un parpadeo (ver src/tema.js).
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('algoritmia:tema') ??
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Banco de ejercicios · Algoritmia</title>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <div class="marca">
          <h1><a href="./" title="Volver al sorteo">Algoritmia</a></h1>
          <p>Banco de ejercicios</p>
        </div>

        <div class="ajustes">
          <a class="boton" href="./">Volver al sorteo</a>
          <button id="btn-tema" class="boton icono" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <g class="sol" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </g>
              <path class="luna" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </aside>

      <!-- src/ver.js llena esta sección: un ejercicio (?id=...) o el catálogo completo. -->
      <main id="contenido" class="principal-contenido"></main>
    </div>

    <script type="module" src="/src/ver.js"></script>
  </body>
</html>
